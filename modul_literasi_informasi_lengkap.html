                        <span class="bg-primary-400 px-4 py-2 rounded-full shadow-sm">PAHAM</span>
                        <i class="fa-solid fa-arrow-right text-slate-400 my-auto"></i>
                        <span class="bg-purple-400 px-4 py-2 rounded-full shadow-sm">INSIGHT</span>
                        <i class="fa-solid fa-arrow-right text-slate-400 my-auto"></i>
                        <span class="bg-orange-400 px-4 py-2 rounded-full shadow-sm">KARYA</span>
                        <i class="fa-solid fa-arrow-right text-slate-400 my-auto"></i>
                        <span class="bg-emerald-500 px-4 py-2 rounded-full shadow-md scale-110">MANFAAT</span>
                    </div>
                    
                    <div class="p-4 bg-dark-surface text-white rounded-xl text-center shadow-xl border-l-4 border-yellow-500">
                        <p class="italic text-sm">"Jangan hanya menjadi penyampai informasi; jadilah penjaga kebenaran melalui proses tabayyun."</p>
                    </div>
                `
            },
            {
                type: 'quiz-intro',
                icon: 'fa-solid fa-gamepad',
                iconColor: 'text-primary-500',
                title: 'Uji Tabayyun Digital',
                content: 'Mari uji insting literasi dan pemahaman Anda terhadap konsep tabayyun digital dari materi ini.<br><br><b>Ada 5 pertanyaan yang menanti.</b>'
            }
        ];

        const quizData = [
            {
                question: "Mana prinsip utama yang diajarkan dalam literasi informasi digital, sejalan dengan QS. Al-Hujurat ayat 6?",
                options: [
                    "Jika informasi dikirim oleh ustadz, pasti kebenarannya mutlak.",
                    "Informasi yang viral wajib disebarkan ulang agar semua tahu.",
                    "Berhenti, periksa teliti (tabayyun), pahami, lalu bertindak.",
                    "Artificial Intelligence selalu menyajikan fakta yang sudah terverifikasi."
                ],
                correct: 2,
                explanation: "Konsep Tabayyun mengharuskan kita menahan diri, memeriksa berlapis, sebelum meyakini dan menyebarkan."
            },
            {
                question: "Terkait 'AI Hallucinations', sikap akademik yang paling tepat saat menggunakan AI untuk membuat makalah adalah...",
                options: [
                    "Meng-copy-paste semua output AI karena AI merangkum jutaan data internet.",
                    "Menggunakan AI untuk mencari ide, lalu memverifikasi rujukan yang diberikan AI ke buku/sumber aslinya.",
                    "Melarang sepenuhnya penggunaan AI dalam bentuk apapun.",
                    "Memasukkan nama AI sebagai penulis utama (Author) di jurnal."
                ],
                correct: 1,
                explanation: "AI bisa mengarang sumber palsu (halusinasi). AI membantu proses, tapi manusia WAJIB memverifikasi sumber aslinya."
            },
            {
                question: "Seseorang hanya memfollow akun dan membaca berita yang sejalan dengan afiliasi politiknya, serta menolak membaca pendapat kelompok lain walau didukung data ilmiah. Fenomena ini disebut...",
                options: [
                    "Triangulasi Data",
                    "Literasi Primer",
                    "Bias Konfirmasi (Filter Bubble)",
                    "Digital Contributor"
                ],
                correct: 2,
                explanation: "Bias konfirmasi membuat kita terjebak hanya pada informasi yang meyakinkan pendapat kita (meski salah) dan diperparah oleh algoritma filter bubble."
            },
            {
                question: "Anda menerima video viral kerusuhan. Sebelum menyebarkan, Anda mengecek portal berita resmi (sumber A), akun kepolisian (sumber B), dan jurnalis lapangan (sumber C). Proses ini disebut...",
                options: [
                    "Penyebaran Hoaks",
                    "Verifikasi Triangulasi (3 Sumber)",
                    "Konsumsi Digital",
                    "Penurunan Insight"
                ],
                correct: 1,
                explanation: "Membandingkan minimal 3 sumber berbeda untuk mencari fakta utuh adalah teknik dasar verifikasi (Triangulasi)."
            },
            {
                question: "Berdasarkan UU ITE Pasal 28 ayat (1), tindakan apa yang bisa mendatangkan sanksi pidana dalam aktivitas digital?",
                options: [
                    "Menyimpan file berita hoaks di laptop pribadi tanpa disebar.",
                    "Mencari sumber primer dari sebuah isu yang sedang viral.",
                    "Sengaja menyebarkan berita bohong dan menyesatkan yang merugikan publik/konsumen.",
                    "Membuat karya dakwah yang membandingkan dua opini pakar."
                ],
                correct: 2,
                explanation: "UU ITE secara tegas melarang penyebaran informasi palsu/menyesatkan yang menimbulkan kerugian di masyarakat."
            }
        ];

        let currentSlide = 0;
        let isQuizMode = false;
        let currentQuiz = 0;
        let score = 0;
        let isDarkMode = false;

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        
        function initAudio() {
            if(!audioCtx) audioCtx = new AudioContext();
            if(audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            try {
                if(!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;
                
                if(type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800, now);
                    osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now); osc.stop(now + 0.1);
                } else if(type === 'slide') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.linearRampToValueAtTime(400, now + 0.1);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.1);
                    osc.start(now); osc.stop(now + 0.1);
                } else if(type === 'correct') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now); // C5
                    osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.3);
                    osc.start(now); osc.stop(now + 0.3);
                } else if(type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(250, now);
                    osc.frequency.linearRampToValueAtTime(150, now + 0.3);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.3);
                    osc.start(now); osc.stop(now + 0.3);
                } else if(type === 'win') {
                    osc.type = 'square';
                    [523, 659, 783, 1046].forEach((freq, i) => {
                        osc.frequency.setValueAtTime(freq, now + (i*0.1));
                    });
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.5);
                    osc.start(now); osc.stop(now + 0.5);
                }
            } catch(e) { console.log('Audio error ignored'); }
        }

        const mainContent = document.getElementById('main-content');
        const btnNext = document.getElementById('btn-next');
        const btnPrev = document.getElementById('btn-prev');
        const btnNextText = document.getElementById('btn-next-text');
        const progressText = document.getElementById('progress-text');
        const progressBar = document.getElementById('progress-bar');
        const themeToggle = document.getElementById('theme-toggle');

        function toggleTheme() {
            initAudio();
            isDarkMode = !isDarkMode;
            document.documentElement.classList.toggle('dark');
            playSound('click');
        }

        function renderSlide(direction = 'right') {
            mainContent.innerHTML = '';
            const animationClass = direction === 'right' ? 'animate-slide-in-right' : 'animate-slide-in-left';
            
            if (!isQuizMode) {
                const slide = slides[currentSlide];
                const html = `
                    <div class="w-full max-w-xl glass-card rounded-3xl p-6 sm:p-10 ${animationClass} flex flex-col items-center mx-4 max-h-full overflow-y-auto hide-scroll relative z-10">
                        <div class="w-20 h-20 sm:w-24 sm:h-24 rounded-2xl bg-white dark:bg-dark-surface shadow-md flex items-center justify-center mb-6 transform rotate-3 animate-float border border-slate-100 dark:border-slate-700">
                            <i class="${slide.icon} ${slide.iconColor} text-4xl sm:text-5xl"></i>
                        </div>
                        <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-800 dark:text-white mb-2 text-center leading-tight tracking-tight">${slide.title}</h2>
                        ${slide.subtitle ? `<h3 class="text-primary-600 dark:text-primary-400 font-bold mb-6 text-center text-sm uppercase tracking-widest">${slide.subtitle}</h3>` : '<div class="h-4"></div>'}
                        <div class="text-slate-700 dark:text-slate-200 text-base w-full flex-1">
                            ${slide.content}
                        </div>
                    </div>
                `;
                mainContent.innerHTML = html;
            } else {
                renderQuizSlide(animationClass);
            }
            updateControls();
        }

        function renderQuizSlide(animationClass) {
            if (currentQuiz >= quizData.length) {
                renderResult(animationClass);
                return;
            }

            const q = quizData[currentQuiz];
            let optionsHtml = q.options.map((opt, index) => `
                <button onclick="checkAnswer(${index})" class="w-full text-left p-4 rounded-xl border-2 border-slate-200 dark:border-slate-600 bg-white dark:bg-dark-surface hover:border-primary-500 dark:hover:border-primary-400 hover:bg-primary-50 dark:hover:bg-primary-900/20 transition-all font-medium text-sm sm:text-base mb-3 group flex items-start gap-3">
                    <span class="shrink-0 flex items-center justify-center w-8 h-8 rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-500 font-bold group-hover:bg-primary-500 group-hover:text-white transition-colors">${String.fromCharCode(65 + index)}</span>
                    <span class="mt-1">${opt}</span>
                </button>
            `).join('');

            mainContent.innerHTML = `
                <div class="w-full max-w-xl glass-card rounded-3xl p-6 sm:p-8 ${animationClass} flex flex-col mx-4 max-h-full overflow-y-auto hide-scroll z-10">
                    <div class="flex justify-between items-center mb-6">
                        <span class="text-primary-500 font-bold uppercase tracking-wider text-xs bg-primary-50 dark:bg-primary-900/30 px-3 py-1 rounded-full"><i class="fa-solid fa-bolt text-yellow-500 mr-1"></i> Kuis Evaluasi</span>
                        <span class="text-xs font-bold text-slate-500 dark:text-slate-400">Soal ${currentQuiz + 1} / ${quizData.length}</span>
                    </div>
                    <h2 class="text-lg sm:text-xl font-bold text-slate-800 dark:text-white mb-6 leading-relaxed">${q.question}</h2>
                    <div id="options-container" class="w-full flex-1">
                        ${optionsHtml}
                    </div>
                    <div id="feedback-container" class="hidden mt-2 p-4 rounded-xl text-sm font-medium animate-pop border"></div>
                </div>
            `;
            
            btnNext.style.display = 'none';
            btnPrev.style.display = 'none';
        }

        window.checkAnswer = function(selectedIndex) {
            initAudio();
            const q = quizData[currentQuiz];
            const isCorrect = selectedIndex === q.correct;
            const buttons = document.querySelectorAll('#options-container button');
            const feedback = document.getElementById('feedback-container');

            buttons.forEach((btn, i) => {
                btn.disabled = true;
                btn.classList.remove('hover:border-primary-500', 'hover:bg-primary-50', 'dark:hover:bg-primary-900/20');
                
                if (i === q.correct) {
                    btn.classList.add('border-emerald-500', 'bg-emerald-50', 'dark:bg-emerald-900/30');
                    btn.querySelector('span').classList.add('bg-emerald-500', 'text-white');
                } else if (i === selectedIndex && !isCorrect) {
                    btn.classList.add('border-rose-500', 'bg-rose-50', 'dark:bg-rose-900/30');
                    btn.querySelector('span').classList.add('bg-rose-500', 'text-white');
                } else {
                    btn.classList.add('opacity-40');
                }
            });

            if (isCorrect) {
                score += 100 / quizData.length;
                playSound('correct');
                feedback.innerHTML = `<div class="flex items-start gap-3 text-emerald-700 dark:text-emerald-300"><i class="fa-solid fa-circle-check mt-1 text-lg"></i> <div><b class="uppercase tracking-wide">Benar</b><br><span class="text-xs mt-1 block opacity-90">${q.explanation}</span></div></div>`;
                feedback.classList.add('bg-emerald-100', 'dark:bg-emerald-900/50', 'border-emerald-200', 'dark:border-emerald-800', 'block');
                feedback.classList.remove('hidden');
            } else {
                playSound('wrong');
                feedback.innerHTML = `<div class="flex items-start gap-3 text-rose-700 dark:text-rose-300"><i class="fa-solid fa-circle-xmark mt-1 text-lg"></i> <div><b class="uppercase tracking-wide">Kurang Tepat</b><br><span class="text-xs mt-1 block opacity-90">${q.explanation}</span></div></div>`;
                feedback.classList.add('bg-rose-100', 'dark:bg-rose-900/50', 'border-rose-200', 'dark:border-rose-800', 'block');
                feedback.classList.remove('hidden');
            }

            btnNext.style.display = 'flex';
            btnNextText.innerText = currentQuiz === quizData.length - 1 ? 'Lihat Hasil' : 'Lanjut';
        }

        function renderResult(animationClass) {
            playSound('win');
            let message = '';
            let icon = '';
            
            if(score === 100) { message = "Luar biasa! Insting verifikasimu sangat tajam."; icon = "fa-trophy text-yellow-500"; } 
            else if(score >= 80) { message = "Sangat baik. Pemahamanmu tentang Tabayyun sudah mantap."; icon = "fa-medal text-emerald-500"; } 
            else if(score >= 60) { message = "Cukup baik, tapi masih perlu lebih berhati-hati menerima info."; icon = "fa-thumbs-up text-primary-500"; } 
            else { message = "Mari baca ulang materinya. Verifikasi informasi butuh latihan!"; icon = "fa-book-open text-rose-500"; }

            mainContent.innerHTML = `
                <div class="w-full max-w-md glass-card rounded-3xl p-8 text-center ${animationClass} flex flex-col items-center z-10">
                    <div class="w-24 h-24 bg-white dark:bg-dark-surface rounded-full flex items-center justify-center shadow-lg mb-6 border border-slate-100 dark:border-slate-700">
                        <i class="fa-solid ${icon} text-5xl animate-pop"></i>
                    </div>
                    <h2 class="text-4xl font-black text-slate-800 dark:text-white mb-2">${Math.round(score)}<span class="text-lg text-slate-400">/100</span></h2>
                    <p class="text-slate-600 dark:text-slate-300 mb-8 text-sm font-medium leading-relaxed">${message}</p>
                    
                    <button onclick="resetModule()" class="w-full py-4 rounded-xl bg-slate-800 dark:bg-slate-700 hover:bg-slate-900 text-white font-bold shadow-lg flex items-center justify-center gap-3 transition-transform active:scale-95">
                        <i class="fa-solid fa-rotate-right"></i> Ulangi Pembelajaran
                    </button>
                </div>
            `;
            
            btnNext.style.display = 'none';
            btnPrev.style.display = 'none';
            progressBar.style.width = '100%';
            progressText.innerText = "Selesai";
        }

        window.resetModule = function() {
            initAudio(); playSound('slide');
            currentSlide = 0; isQuizMode = false; currentQuiz = 0; score = 0;
            btnNext.style.display = 'flex'; btnPrev.style.display = 'flex';
            renderSlide('left');
        }

        function updateControls() {
            let totalSteps = slides.length + quizData.length;
            let currentStep = isQuizMode ? slides.length + currentQuiz + 1 : currentSlide + 1;

            if (!isQuizMode) {
                btnPrev.disabled = currentSlide === 0;
                if (currentSlide === slides.length - 1) {
                    btnNextText.innerText = 'Mulai Kuis';
                    btnNext.classList.replace('from-primary-600', 'from-yellow-500');
                    btnNext.classList.replace('to-primary-500', 'to-orange-500');
                    btnNext.classList.replace('shadow-primary-500/30', 'shadow-yellow-500/30');
                } else {
                    btnNextText.innerText = currentSlide === 0 ? 'Mulai Belajar' : 'Selanjutnya';
                    btnNext.classList.replace('from-yellow-500', 'from-primary-600');
                    btnNext.classList.replace('to-orange-500', 'to-primary-500');
                    btnNext.classList.replace('shadow-yellow-500/30', 'shadow-primary-500/30');
                }
            }
            progressText.innerText = `${currentStep} / ${totalSteps}`;
            progressBar.style.width = `${(currentStep / totalSteps) * 100}%`;
        }

        btnNext.addEventListener('click', () => {
            initAudio(); playSound('slide');
            if (!isQuizMode) {
                if (currentSlide < slides.length - 1) { currentSlide++; renderSlide('right'); } 
                else { isQuizMode = true; renderSlide('right'); }
            } else {
                currentQuiz++; renderSlide('right');
            }
        });

        btnPrev.addEventListener('click', () => {
            initAudio(); playSound('slide');
            if (!isQuizMode && currentSlide > 0) { currentSlide--; renderSlide('left'); }
        });

        themeToggle.addEventListener('click', toggleTheme);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' && btnNext.style.display !== 'none' && !btnNext.disabled) btnNext.click();
            else if (e.key === 'ArrowLeft' && btnPrev.style.display !== 'none' && !btnPrev.disabled) btnPrev.click();
        });

        // Initialize App
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) toggleTheme();
        renderSlide('right');
    </script>
</body>
</html>
